<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="bohyeon04가 만든 게임과 웹 작업을 소개하는 공간입니다.">
  <title>bohyeon04 · 작업실</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0a1420;
      --surface: #101f2d;
      --border: #2a4252;
      --text: #f0f9fa;
      --muted: #abc2cc;
      --accent: #67f0cd;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 70% 0, #163747, transparent 40rem), var(--background);
      color: var(--text);
      font: 1rem/1.65 system-ui, sans-serif;
      word-break: keep-all;
    }

    .shell { width: min(68rem, calc(100% - 2.5rem)); margin-inline: auto; }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1rem;
      border-bottom: 1px solid var(--border);
    }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .brand { font-weight: 750; }
    .brand span { color: var(--accent); }
    .navigation { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem 1rem; }
    .github { color: var(--muted); text-underline-offset: .22em; }
    .github:hover { color: var(--accent); }

    .hero {
      padding-block: clamp(3rem, 8vw, 6rem) clamp(2rem, 5vw, 3.5rem);
    }
    .eyebrow, .tag {
      color: var(--accent);
      font: 700 .78rem/1.4 ui-monospace, monospace;
      letter-spacing: .14em;
    }

    h1 {
      margin: .55rem 0 .8rem;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.15;
      letter-spacing: -.045em;
    }

    p { margin: 0; }
    .intro, .description { color: var(--muted); }
    .collection + .collection { margin-top: 2.75rem; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: .35rem 1rem;
      margin-bottom: 1rem;
    }
    .section-title { margin: 0; font-size: 1.35rem; }
    .projects {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }
    .project {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
    }

    .art {
      display: grid;
      place-items: center;
      min-height: 9rem;
      border-bottom: 1px solid var(--border);
      background-color: #0c1826;
      background-image: linear-gradient(#1a3142 1px, transparent 1px),
                        linear-gradient(90deg, #1a3142 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .art svg { width: min(60%, 9rem); height: auto; }
    .details {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-start;
      padding: 1.25rem;
    }
    .details h3 { margin: .25rem 0 .45rem; font-size: 1.25rem; line-height: 1.35; }
    .description { flex: 1; }
    .music { --accent: #e8b3ff; }
    .music-heading p { margin-top: .2rem; color: var(--muted); }
    .music .projects { grid-template-columns: 1fr; }
    .track {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
    }
    .track .details { padding: 0; }
    .song-player {
      display: block;
      width: 100%;
      height: 152px;
      border: 0;
      border-radius: .65rem;
    }
    .action {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      min-height: 44px;
      margin-top: 1.2rem;
      padding: .55rem .95rem;
      border-radius: .5rem;
      background: var(--accent);
      color: #082018;
      text-decoration: none;
      font-weight: 750;
    }

    .action:hover { background: #a2ffe7; }
    footer {
      margin-top: 3rem;
      border-top: 1px solid var(--border);
      border-bottom: 0;
      color: var(--muted);
      font-size: .875rem;
    }

    @media (max-width: 48rem) {
      .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .track { grid-template-columns: 1fr; }
    }

    @media (max-width: 32rem) {
      .projects { grid-template-columns: 1fr; }
    }
  
    .featured { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem;align-items:start;margin-bottom:3rem; }
    .featured > section { min-width:0; }
    .featured .section-header { margin-bottom:1rem; }
    .featured .project { min-height:27rem; }
    .featured .track { display:flex;padding:0;align-items:stretch;gap:0; }
    .featured .track .details { padding:1.5rem;flex:1; }
    .featured .track .song-player { height:190px;border-radius:0;border-top:1px solid var(--border); }
    .featured .art { min-height:12rem; }
    .featured .details { padding:1.5rem; }
    .featured .track .tag { margin-bottom:.75rem; }
    .featured .track h3 { font-size:1.6rem;margin-bottom:1rem; }
    @media(max-width:42rem) { .featured {grid-template-columns:1fr;} .featured .project {min-height:0;} }
  </style>
</head>
<body class="shell">
  <header>
    <div class="brand"><span aria-hidden="true">▰</span> bohyeon04</div>
    <nav class="navigation" aria-label="페이지 메뉴">
      <a class="github" href="/game/">게임</a>
      <a class="github" href="/music/">음악</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <p class="eyebrow">PLAY · LISTEN · CREATE</p>
      <h1>BOHYEON LAB</h1>
      <p class="intro">직접 만든 게임과 음악을 만나는 공간.</p>
    </div>
    <div class="featured">
      <section aria-labelledby="featured-game">
        <div class="section-header"><h2 class="section-title" id="featured-game">대표 게임</h2><a class="github" href="/game/">게임 더보기 ↗</a></div>
        <article class="project">
          <div class="art" aria-hidden="true">
            <svg viewBox="0 0 192 120" fill="none">
              <path d="M24 84h48V36h48v24h24" stroke="#36cea9" stroke-width="20"/>
              <rect x="134" y="50" width="20" height="20" rx="2" fill="#a6ffea"/>
              <circle cx="174" cy="60" r="7" fill="#ff7798"/>
            </svg>
          </div>
          <div class="details">
            <p class="tag">ARCADE</p>
            <h3>네온 스네이크</h3>
            <p class="description">먹이를 먹을수록 길어지는 뱀을 조종해 최고 점수에 도전하세요.</p>
            <a class="action" href="https://bohyeon04.github.io/game/03.html" aria-label="네온 스네이크 플레이하기">
              플레이하기 <span aria-hidden="true">↗</span>
            </a>
          </div>
        </article>
      </section>
      <section class="music" aria-labelledby="featured-song">
        <div class="section-header"><h2 class="section-title" id="featured-song">대표 노래</h2><a class="github" href="/music/">노래 더보기 ↗</a></div>
        <article class="project track">
          <div class="details">
            <p class="tag">R&amp;B · BALLAD</p>
            <h3>아직 너를 사는 중</h3>
            <p class="description">이별 뒤에 남은 그리움을 담은 새벽 감성 R&amp;B.</p>
          </div>
          <iframe class="song-player" title="아직 너를 사는 중 재생"
            src="https://suno.com/embed/8e3c2c4d-1ba4-4400-8ea5-1c8c7946867d"
            loading="lazy" allow="autoplay"></iframe>
        </article>
      </section>
    </div>
  </main>

  <footer>bohyeon04 · 작업실</footer>
</body>
</html>
